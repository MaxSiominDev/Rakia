name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS build, tests, smoke render
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make EXTRA_CFLAGS=-Werror
      - name: Unit tests
        run: make test
      - name: Smoke render
        run: ./rakia --window 256x256 --screenshot smoke.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: smoke.bmp
      - name: Compare with the reference render
        if: hashFiles('tests/reference/macos-256.bmp') != ''
        run: python3 tools/compare-bmp.py --outliers 0.02 tests/reference/macos-256.bmp smoke.bmp

  windows:
    name: Windows build and smoke render
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            curl
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
      - name: Build static freeglut
        run: tools/build-freeglut-win32.sh
      - name: Build rakia.exe
        run: make windows EXTRA_CFLAGS=-Werror
      - uses: actions/upload-artifact@v4
        with:
          name: rakia-windows
          path: rakia.exe
      - name: Install Mesa
        shell: pwsh
        run: |
          $version = '26.2.0'
          $asset = "mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$version/$asset" -OutFile $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47') {
            throw "unexpected checksum $hash"
          }
          7z x $asset -omesa -y | Out-Null
          Copy-Item mesa\x64\*.dll .
      - name: Render one frame
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $process = Start-Process -FilePath .\rakia.exe `
            -ArgumentList '--window', '256x256', '--screenshot', 'smoke.bmp' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "rakia.exe exited with $($process.ExitCode)"
          }
      - name: Check the screenshot
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes('smoke.bmp')
          $width = [BitConverter]::ToInt32($bytes, 18)
          $height = [BitConverter]::ToInt32($bytes, 22)
          if ($bytes[0] -ne 0x42 -or $bytes[1] -ne 0x4D -or $width -ne 256 -or $height -ne 256) {
            throw "smoke.bmp is not a 256x256 BMP (got ${width}x${height})"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: smoke.bmp
      - name: Compare with the reference render
        if: hashFiles('tests/reference/windows-256.bmp') != ''
        shell: pwsh
        run: python tools/compare-bmp.py tests/reference/windows-256.bmp smoke.bmp
