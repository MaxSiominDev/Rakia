name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  macos:
    name: macOS release build
    runs-on: macos-latest
    # workflow_dispatch defaults to the branch picked in the Actions UI; only a tag ref names a release
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make release EXTRA_CFLAGS=-Werror
      - name: Check the binary is universal
        run: |
          archs=$(lipo -archs build/release/rakia-macos)
          echo "$archs" | grep -q arm64 || { echo "missing arm64 in: $archs"; exit 1; }
          echo "$archs" | grep -q x86_64 || { echo "missing x86_64 in: $archs"; exit 1; }
      - name: Release smoke render
        run: |
          dir=$(mktemp -d)
          cp build/release/rakia-macos "$dir/"
          cd "$dir"
          ./rakia-macos --window 256x256 --screenshot smoke.bmp
          if [ ! -s smoke.bmp ]; then
            echo "smoke.bmp is missing or empty"
            exit 1
          fi
      # a flat copy at the workspace root, so the artifact always downloads as a bare file named
      # rakia-macos regardless of upload-artifact's path handling for a nested source
      - run: cp build/release/rakia-macos rakia-macos
      - uses: actions/upload-artifact@v4
        with:
          name: rakia-macos
          path: rakia-macos

  windows:
    name: Windows release build
    runs-on: windows-latest
    if: github.ref_type == 'tag'
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            curl
            tar
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-binutils
      - name: Build static freeglut
        run: tools/build-freeglut-win32.sh
      - name: Build rakia-windows.exe
        run: make windows-release EXTRA_CFLAGS=-Werror
      - name: Check the exe has no unexpected DLL imports
        run: |
          # the release has to run where no toolchain is installed, so no MinGW runtime DLL may be imported;
          # which C runtime the system DLLs come from, msvcrt or the universal one, depends on the toolchain
          objdump=$(command -v x86_64-w64-mingw32-objdump || command -v objdump)
          "$objdump" -p build/release/rakia-windows.exe | grep "DLL Name:" | sed -E 's/.*DLL Name: *//; s/\r$//' | tee imports.txt
          if grep -Eiq '^lib' imports.txt; then
            echo "the exe imports a MinGW runtime DLL"
            exit 1
          fi
      - name: Download Mesa
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-smoke'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $version = '26.2.0'
          $asset = "mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/$version/$asset" -OutFile $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47') {
            throw "unexpected checksum $hash"
          }
          7z x $asset -o"$dir\mesa" -y | Out-Null
          Copy-Item "$dir\mesa\x64\*.dll" $dir
      - name: Release smoke render
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-smoke'
          Copy-Item build\release\rakia-windows.exe $dir
          $process = Start-Process -FilePath (Join-Path $dir 'rakia-windows.exe') `
            -ArgumentList '--window', '256x256', '--screenshot', 'smoke.bmp' -WorkingDirectory $dir -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "rakia-windows.exe exited with $($process.ExitCode)"
          }
      - name: Check the release screenshot
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-smoke'
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $dir 'smoke.bmp'))
          $width = [BitConverter]::ToInt32($bytes, 18)
          $height = [BitConverter]::ToInt32($bytes, 22)
          if ($bytes[0] -ne 0x42 -or $bytes[1] -ne 0x4D -or $width -ne 256 -or $height -ne 256) {
            throw "smoke.bmp is not a 256x256 BMP (got ${width}x${height})"
          }
      - run: cp build/release/rakia-windows.exe rakia-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rakia-windows
          path: rakia-windows.exe

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rakia-macos
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: rakia-windows
          path: .
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rakia-macos rakia-windows.exe --clobber
          else
            gh release create "$TAG" rakia-macos rakia-windows.exe --title "$TAG" --generate-notes
          fi
