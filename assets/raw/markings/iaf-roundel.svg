<?xml version="1.0" encoding="UTF-8"?>
<!-- Israeli Air Force roundel: blue Star of David on a white disc.
     Drawn from scratch for the opengl2 project from reference photos and the
     public description of the insignia (no third-party artwork copied).
     Geometry: disc radius 100, star circumradius 81 (points at 0.81 of the disc).
     Star colour #0038B8 is the blue of the Israeli flag; aircraft paint varies
     from this to a darker navy, change the fill if needed.
     Rasterize e.g. with: rsvg-convert -w 1024 -h 1024 iaf-roundel.svg -o iaf-roundel.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-100 -100 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <circle cx="0" cy="0" r="100" fill="#FFFFFF"/>
  <g fill="#0038B8">
    <polygon points="0.000,-81.000 70.148,40.500 -70.148,40.500"/>
    <polygon points="0.000,81.000 -70.148,-40.500 70.148,-40.500"/>
  </g>
</svg>
